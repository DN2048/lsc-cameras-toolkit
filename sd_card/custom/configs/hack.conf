# Main configuration file for SD customizations.
# Format: strict shell KEY=value lines.

# Write logs to the card
LOGS=0

# Dump file system to the card
DUMP_FORCE=0

# Block Tuya domains (pointless in factory mode but still, who knows)
OFFLINE=1

# Bind-mount custom hw settings over /etc/config/_ht_hw_settings.ini
OVERRIDE_HW_SETTINGS=1
# Bind-mount custom sw settings over /etc/config/_ht_sw_settings.ini (might not work)
OVERRIDE_SW_SETTINGS=0
# Bind-mount custom anyka settings over /etc/config/anyka_cfg.ini (might not work)
OVERRIDE_ANYKA_SETTINGS=0

# Mute loud factory mode boot voice/beep prompt files.
MUTE_FACTORY_PROMPT=1
MUTE_ALL_SOUNDS=1

# Timestamp visibility (0=off, 1=on)
TIMESTAMP=0

# Change night mode (0=always off, 1=auto (default behaviour))
NIGHT_MODE=0

# Disables the (blinking) led
DISABLE_LED=1

# FTP access to the card, no login required
FTP=1
FTP_PORT=21